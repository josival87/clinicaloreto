name: clinica-loreto
x-app: &app
  image: clinica-loreto-app:local
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    COGNITION_URL: http://cognition:8001
  volumes:
    - storage:/var/www/html/storage
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-base
      args:
        VITE_APP_BASE_PATH: ${APP_BASE_PATH:-}
  web:
    image: clinica-loreto-web:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        VITE_APP_BASE_PATH: ${APP_BASE_PATH:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8090}:80"
    depends_on:
      - app
    restart: unless-stopped
  scheduler:
    <<: *app
    command: [php, artisan, schedule:work]
  cognition:
    image: clinica-loreto-cognition:local
    build: ./cognition
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  database:
  storage:
